<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  shape-rendering="crispEdges"
  role="img"
  aria-label="Retro developer terminal — 8-bit pixel art"
>
  <!-- Black background fill (becomes the "monitor bezel" via foreground theming) -->
  <rect width="32" height="32" fill="#111111"/>

  <!-- Outer monitor bezel (light gray, beige-tinted for that 90s plastic vibe) -->
  <rect x="3" y="4" width="26" height="20" fill="#cdc6b8"/>

  <!-- Inner CRT screen (deep black) -->
  <rect x="5" y="6" width="22" height="16" fill="#0b0f0a"/>

  <!-- CRT scanline glow (subtle green tint on screen edges) -->
  <rect x="5" y="6" width="22" height="1" fill="#1a3d24"/>
  <rect x="5" y="21" width="22" height="1" fill="#1a3d24"/>

  <!-- Terminal prompt: `> _` in classic phosphor green -->
  <!-- The `>` character -->
  <rect x="7" y="9" width="1" height="1" fill="#52d273"/>
  <rect x="8" y="10" width="1" height="1" fill="#52d273"/>
  <rect x="9" y="11" width="1" height="1" fill="#52d273"/>
  <rect x="8" y="12" width="1" height="1" fill="#52d273"/>
  <rect x="7" y="13" width="1" height="1" fill="#52d273"/>

  <!-- The blinking cursor block -->
  <rect x="11" y="11" width="2" height="2" fill="#52d273">
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1.1s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Second line of "code" — short row of green pixels (function signature) -->
  <rect x="7" y="15" width="2" height="1" fill="#3a8f4f"/>
  <rect x="10" y="15" width="4" height="1" fill="#3a8f4f"/>
  <rect x="15" y="15" width="1" height="1" fill="#3a8f4f"/>
  <rect x="17" y="15" width="3" height="1" fill="#3a8f4f"/>

  <!-- Third line: shorter, like a return value -->
  <rect x="9" y="17" width="2" height="1" fill="#3a8f4f"/>
  <rect x="12" y="17" width="6" height="1" fill="#3a8f4f"/>

  <!-- Fourth line: very short -->
  <rect x="9" y="19" width="3" height="1" fill="#3a8f4f"/>

  <!-- Monitor stand (vertical neck) -->
  <rect x="14" y="24" width="4" height="3" fill="#cdc6b8"/>

  <!-- Monitor base (wide foot) -->
  <rect x="10" y="27" width="12" height="2" fill="#a39d8f"/>
  <rect x="9" y="29" width="14" height="1" fill="#8a8478"/>

  <!-- Power LED (small red dot in bottom-right of bezel) -->
  <rect x="26" y="22" width="1" height="1" fill="#ff4444"/>
</svg>
