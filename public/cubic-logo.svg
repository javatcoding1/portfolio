<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="#002D62"/>
  <!-- Isometric 3D Cube -->
  <!-- Top Face -->
  <polygon points="60,28 88,44 60,60 32,44" fill="#00A3E0"/>
  <!-- Left Face -->
  <polygon points="32,44 60,60 60,92 32,76" fill="#0072CE"/>
  <!-- Right Face -->
  <polygon points="60,60 88,44 88,76 60,92" fill="#004B87"/>
  <!-- Inner cube accent line -->
  <polyline points="60,28 60,60 32,44" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <polyline points="60,60 88,44" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <polyline points="60,60 60,92" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>